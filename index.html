<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>丹波の七日間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — header with "now", a 7-day temperature band chart, then one row per day (past dimmed, today marked). */
:root {
  --bg: #f3f4f1;          /* 丹波霧の朝 */
  --surface: #ffffff;
  --fg: #23272b;
  --muted: #6b7178;
  --line: #d9dcd6;
  --warm: #b4482f;        /* 最高気温 */
  --cool: #2f5f8f;        /* 最低気温 */
  --today: #5b3a26;       /* 丹波栗 */
  --past-bg: #e9ebe6;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --surface: #1d2125; --fg: #e8eae6; --muted: #9aa1a8; --line: #30363b;
    --warm: #e8826a; --cool: #7fb0e0; --today: #d9a77f; --past-bg: #191c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --surface: #1d2125; --fg: #e8eae6; --muted: #9aa1a8; --line: #30363b;
  --warm: #e8826a; --cool: #7fb0e0; --today: #d9a77f; --past-bg: #191c1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.75rem; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.place { color: var(--muted); font-size: .8rem; letter-spacing: .08em; }
.now { text-align: right; }
.now .t { font-family: var(--display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.now .s { color: var(--muted); font-size: .8rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 10px 8px; }
.legend { display: flex; gap: 16px; font-size: .75rem; color: var(--muted); padding: 0 6px 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
svg { display: block; width: 100%; height: auto; }
.days { display: grid; gap: 0; border-top: 1px solid var(--line); }
.day {
  display: grid; grid-template-columns: 4.6em 1fr auto auto; align-items: center; gap: 10px;
  padding: 10px 8px; border-bottom: 1px solid var(--line);
}
.day.past { background: var(--past-bg); color: var(--muted); }
.day.past .hi, .day.past .lo { opacity: .8; }
.day.today { box-shadow: inset 3px 0 0 var(--today); }
.date { font-variant-numeric: tabular-nums; line-height: 1.25; }
.date b { display: block; font-weight: 700; }
.date small { font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
.today .date small { color: var(--today); font-weight: 700; }
.wx { display: flex; align-items: center; gap: 8px; min-width: 0; }
.wx span { font-size: .88rem; overflow-wrap: anywhere; }
.wx small { display: block; color: var(--muted); font-size: .72rem; }
.wx svg { width: 28px; height: 28px; flex: none; }
.temp { text-align: right; font-variant-numeric: tabular-nums; min-width: 4.2em; line-height: 1.2; }
.temp .v { font-size: 1.15rem; font-weight: 700; }
.hi .v { color: var(--warm); }
.lo .v { color: var(--cool); }
.temp .d { display: block; font-size: .72rem; color: var(--muted); }
.temp .d.up { color: var(--warm); }
.temp .d.down { color: var(--cool); }
.note { color: var(--muted); font-size: .75rem; line-height: 1.7; }
.state { padding: 24px 8px; text-align: center; color: var(--muted); }
button {
  font: inherit; font-size: .8rem; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
@media (max-width: 420px) {
  .day { grid-template-columns: 3.9em 1fr auto auto; gap: 6px; padding: 10px 4px; }
  .wx svg { width: 24px; height: 24px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>丹波の七日間</h1>
      <div class="place">兵庫県丹波市 ・ 過去3日 / 今日 / 先3日</div>
    </div>
    <div class="now" id="now"><div class="t">--°</div><div class="s">読み込み中</div></div>
  </header>

  <section class="panel" aria-label="気温の推移">
    <div class="legend">
      <span><i style="background:var(--warm)"></i>最高気温</span>
      <span><i style="background:var(--cool)"></i>最低気温</span>
      <span>網かけ＝過去（実績）</span>
    </div>
    <div id="chart"><div class="state">気温データを取得しています…</div></div>
  </section>

  <section class="days" id="days" aria-label="日ごとの天気"></section>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="note" id="updated"></div>
    <button id="reload" type="button">更新</button>
  </div>
  <p class="note">データ：Open-Meteo（地点 北緯35.17・東経135.04、丹波市氷上町付近）。過去の値は観測とモデルを合わせた推定値で、アメダス柏原の観測値と少しずれることがあります。差は前日との比較です。</p>
</div>

<script>
const LAT = 35.1736, LON = 135.0359;
const URL_API = "https://api.open-meteo.com/v1/forecast"
  + `?latitude=${LAT}&longitude=${LON}`
  + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum"
  + "&current=temperature_2m,weather_code"
  + "&timezone=Asia%2FTokyo&past_days=3&forecast_days=4";

const WD = ["日","月","火","水","木","金","土"];

function wxInfo(code) {
  if (code === 0) return ["快晴", "sun"];
  if (code === 1) return ["晴れ", "sun"];
  if (code === 2) return ["晴れ時々くもり", "partly"];
  if (code === 3) return ["くもり", "cloud"];
  if (code === 45 || code === 48) return ["霧", "fog"];
  if (code >= 51 && code <= 57) return ["霧雨", "rain"];
  if (code >= 61 && code <= 67) return [code >= 65 ? "強い雨" : "雨", "rain"];
  if (code >= 71 && code <= 77) return ["雪", "snow"];
  if (code >= 80 && code <= 82) return ["にわか雨", "rain"];
  if (code === 85 || code === 86) return ["にわか雪", "snow"];
  if (code >= 95) return ["雷雨", "storm"];
  return ["—", "cloud"];
}

function icon(kind) {
  const sun = '<circle cx="16" cy="16" r="6" fill="#e0a234"/>' +
    [0,45,90,135,180,225,270,315].map(a => {
      const r = a * Math.PI / 180, x1 = 16 + Math.cos(r) * 9, y1 = 16 + Math.sin(r) * 9,
            x2 = 16 + Math.cos(r) * 12, y2 = 16 + Math.sin(r) * 12;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#e0a234" stroke-width="2" stroke-linecap="round"/>`;
    }).join("");
  const cloud = (dx = 0, dy = 0) => `<path transform="translate(${dx} ${dy})" d="M9 24h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.8A4.2 4.2 0 0 0 9 24z" fill="var(--muted)" opacity=".85"/>`;
  let g = "";
  if (kind === "sun") g = sun;
  else if (kind === "partly") g = '<g transform="translate(-4 -4) scale(.8)">' + sun + '</g>' + cloud(2, 2);
  else if (kind === "cloud") g = cloud();
  else if (kind === "fog") g = cloud(0, -3) + '<line x1="6" y1="26" x2="26" y2="26" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="30" x2="23" y2="30" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>';
  else if (kind === "rain") g = cloud(0, -4) + [10,16,22].map(x => `<line x1="${x}" y1="24" x2="${x-2}" y2="30" stroke="var(--cool)" stroke-width="2" stroke-linecap="round"/>`).join("");
  else if (kind === "snow") g = cloud(0, -4) + [10,16,22].map(x => `<circle cx="${x}" cy="27" r="1.8" fill="var(--cool)"/>`).join("");
  else if (kind === "storm") g = cloud(0, -4) + '<path d="M17 21l-4 6h4l-2 5 6-7h-4l2-4z" fill="#e0a234"/>';
  return `<svg viewBox="0 0 32 32" aria-hidden="true">${g}</svg>`;
}

const fmt = v => v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1);
function diff(cur, prev) {
  if (cur == null || prev == null) return '<span class="d">&nbsp;</span>';
  const d = Math.round((cur - prev) * 10) / 10;
  if (d === 0) return '<span class="d">±0</span>';
  return `<span class="d ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(1)}</span>`;
}

function todayStr() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const o = Object.fromEntries(p.map(x => [x.type, x.value]));
  return `${o.year}-${o.month}-${o.day}`;
}

function renderChart(days, todayIdx) {
  const W = 420, H = 250, padL = 4, padR = 4, top = 30, bottom = 40;
  const n = days.length, col = (W - padL - padR) / n;
  const vals = days.flatMap(d => [d.hi, d.lo]).filter(v => v != null);
  let mn = Math.floor(Math.min(...vals) - 2), mx = Math.ceil(Math.max(...vals) + 2);
  const y = v => top + (mx - v) / (mx - mn) * (H - top - bottom);
  const x = i => padL + col * i + col / 2;
  let s = "";
  // 過去の網かけ
  if (todayIdx > 0) s += `<rect x="${padL}" y="0" width="${col * todayIdx}" height="${H}" fill="var(--past-bg)"/>`;
  // 今日の帯
  s += `<rect x="${padL + col * todayIdx}" y="0" width="${col}" height="${H}" fill="var(--today)" opacity=".08"/>`;
  // 補助線
  const step = (mx - mn) > 16 ? 5 : 2;
  for (let t = Math.ceil(mn / step) * step; t <= mx; t += step) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${W - padR}" y="${y(t) - 3}" text-anchor="end" font-size="10" fill="var(--muted)">${t}°</text>`;
  }
  // 最高〜最低の縦帯
  days.forEach((d, i) => {
    if (d.hi != null && d.lo != null)
      s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(d.hi)}" y2="${y(d.lo)}" stroke="var(--muted)" stroke-width="6" stroke-linecap="round" opacity=".18"/>`;
  });
  const path = key => days.map((d, i) => d[key] == null ? null : [x(i), y(d[key])]).filter(Boolean)
    .map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  s += `<path d="${path("hi")}" fill="none" stroke="var(--warm)" stroke-width="2.2" stroke-linejoin="round"/>`;
  s += `<path d="${path("lo")}" fill="none" stroke="var(--cool)" stroke-width="2.2" stroke-linejoin="round"/>`;
  days.forEach((d, i) => {
    const isT = i === todayIdx, r = isT ? 5 : 3.5;
    if (d.hi != null) {
      s += `<circle cx="${x(i)}" cy="${y(d.hi)}" r="${r}" fill="var(--warm)" stroke="var(--surface)" stroke-width="1.5"/>`;
      s += `<text x="${x(i)}" y="${y(d.hi) - 9}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warm)">${Math.round(d.hi)}</text>`;
    }
    if (d.lo != null) {
      s += `<circle cx="${x(i)}" cy="${y(d.lo)}" r="${r}" fill="var(--cool)" stroke="var(--surface)" stroke-width="1.5"/>`;
      s += `<text x="${x(i)}" y="${y(d.lo) + 19}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--cool)">${Math.round(d.lo)}</text>`;
    }
    const lbl = i === todayIdx ? "今日" : i === todayIdx - 1 ? "昨日" : i === todayIdx + 1 ? "明日" : `${d.m}/${d.d}`;
    s += `<text x="${x(i)}" y="${H - 20}" text-anchor="middle" font-size="12" font-weight="${isT ? 700 : 500}" fill="${isT ? "var(--today)" : "var(--fg)"}">${lbl}</text>`;
    s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.wd}</text>`;
  });
  document.getElementById("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="7日間の最高・最低気温の折れ線グラフ" font-family="Zen Kaku Gothic New, sans-serif">${s}</svg>`;
}

function renderDays(days, todayIdx) {
  document.getElementById("days").innerHTML = days.map((d, i) => {
    const cls = i < todayIdx ? "past" : i === todayIdx ? "today" : "";
    const tag = i === todayIdx ? "今日" : i === todayIdx - 1 ? "昨日" : i === todayIdx + 1 ? "明日" : i < todayIdx ? "過去" : "予報";
    const [name, kind] = wxInfo(d.code);
    const rain = i < todayIdx
      ? (d.psum != null ? `降水 ${d.psum.toFixed(1)}mm` : "")
      : (d.pop != null ? `降水確率 ${d.pop}%` : "");
    const prev = days[i - 1];
    return `<div class="day ${cls}">
      <div class="date"><b>${d.m}/${d.d}</b><small>${d.wd} ・ ${tag}</small></div>
      <div class="wx">${icon(kind)}<span>${name}<small>${rain}</small></span></div>
      <div class="temp hi"><span class="v">${fmt(d.hi)}°</span>${diff(d.hi, prev?.hi)}</div>
      <div class="temp lo"><span class="v">${fmt(d.lo)}°</span>${diff(d.lo, prev?.lo)}</div>
    </div>`;
  }).join("");
}

async function load() {
  const nowEl = document.getElementById("now");
  try {
    const res = await fetch(URL_API, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const dl = j.daily;
    const days = dl.time.map((t, i) => {
      const [Y, M, D] = t.split("-").map(Number);
      return {
        date: t, m: M, d: D, wd: WD[new Date(Y, M - 1, D).getDay()],
        hi: dl.temperature_2m_max[i], lo: dl.temperature_2m_min[i],
        code: dl.weather_code[i], pop: dl.precipitation_probability_max?.[i], psum: dl.precipitation_sum?.[i]
      };
    });
    let todayIdx = days.findIndex(d => d.date === todayStr());
    if (todayIdx < 0) todayIdx = 3;
    renderChart(days, todayIdx);
    renderDays(days, todayIdx);
    if (j.current) {
      nowEl.innerHTML = `<div class="t">${fmt(j.current.temperature_2m)}°</div><div class="s">いま ・ ${wxInfo(j.current.weather_code)[0]}</div>`;
    }
    const t = new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    document.getElementById("updated").textContent = `${t} に取得`;
  } catch (e) {
    document.getElementById("chart").innerHTML =
      `<div class="state">天気データを取得できませんでした（${e.message}）。通信状況を確認して「更新」を押してください。</div>`;
    nowEl.innerHTML = '<div class="t">--°</div><div class="s">取得できませんでした</div>';
  }
}

document.getElementById("reload").addEventListener("click", load);
load();
</script>
</body>
</html>
